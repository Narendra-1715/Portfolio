<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051d"/>
      <stop offset="50%" stop-color="#0e1738"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1845"/>
      <stop offset="100%" stop-color="#0f0b24"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowApex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgApex)"/>

  <!-- Background Glows -->
  <circle cx="200" cy="150" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glowApex)"/>
  <circle cx="650" cy="350" r="180" fill="#6366f1" opacity="0.15" filter="url(#glowApex)"/>

  <!-- Desktop App Mockup Frame -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="480" height="360" rx="16" fill="rgba(14, 10, 32, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect x="0" y="0" width="480" height="42" rx="16" fill="rgba(24, 18, 54, 0.9)"/>
    <rect x="0" y="26" width="480" height="16" fill="rgba(24, 18, 54, 0.9)"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="41" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="57" cy="21" r="5" fill="#10b981"/>
    <text x="80" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">APEX WEB SUITE // RESPONSIVE UI ENGINE</text>

    <!-- Sidebar in Desktop -->
    <rect x="15" y="58" width="105" height="285" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="25" y="75" width="85" height="14" rx="4" fill="rgba(99, 102, 241, 0.4)"/>
    <rect x="25" y="102" width="70" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="25" y="122" width="80" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="25" y="142" width="65" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>

    <!-- Desktop Content Cards -->
    <rect x="135" y="58" width="330" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.25)"/>
    <text x="155" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PERFORMANCE SCORE</text>
    <text x="155" y="120" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">99.4%</text>
    <text x="260" y="115" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">▲ +14% vs benchmark</text>

    <!-- Chart lines in Desktop -->
    <path d="M 145 230 Q 210 180 270 205 T 400 170 T 450 160" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 145 250 Q 210 220 270 230 T 400 200 T 450 190" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4,4"/>

    <rect x="135" y="270" width="155" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="305" y="270" width="160" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Mobile Mockup Frame (overlapping right) -->
  <g transform="translate(560, 110)">
    <rect x="0" y="0" width="175" height="340" rx="24" fill="#0c071d" stroke="rgba(168, 85, 247, 0.5)" stroke-width="2" filter="url(#glowApex)"/>
    <!-- Speaker / Notch -->
    <rect x="55" y="10" width="65" height="12" rx="6" fill="#1b1338"/>
    <!-- Mobile Card -->
    <rect x="16" y="42" width="143" height="75" rx="12" fill="url(#cyanAccent)"/>
    <text x="28" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Responsive</text>
    <text x="28" y="90" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10">Mobile-First UI</text>

    <rect x="16" y="130" width="143" height="50" rx="10" fill="rgba(255,255,255,0.06)"/>
    <rect x="16" y="190" width="143" height="50" rx="10" fill="rgba(255,255,255,0.06)"/>
    <rect x="16" y="250" width="143" height="50" rx="10" fill="rgba(255,255,255,0.06)"/>
  </g>
</svg>
